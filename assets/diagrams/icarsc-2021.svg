.dg-comm{fill:none;stroke:var(--steel,#2f5f8a);stroke-width:1.5;stroke-dasharray:6 3 1.5 3}
.dg-ray{fill:none;stroke:var(--accent,#b0582d);stroke-width:1.5;stroke-dasharray:5 4}
.dg-target{fill:var(--accent,#b0582d)}
.dg-est{fill:none;stroke:var(--accent,#b0582d);stroke-width:1.5}
.dg-faint{fill:none;stroke:var(--muted,#56606b);stroke-width:1.4;stroke-dasharray:4 4;stroke-opacity:.6}
.dg-c1{fill:none;stroke:var(--accent,#b0582d);stroke-width:2.2}
.dg-c2{fill:none;stroke:var(--steel,#2f5f8a);stroke-width:2.2}
.dg-c3{fill:none;stroke:var(--sage,#5e7d4f);stroke-width:2.2}
.dg-c4{fill:none;stroke:var(--ink,#1b2127);stroke-width:2.2;stroke-opacity:.75}
.dg-c5{fill:none;stroke:var(--muted,#56606b);stroke-width:2.2}
.dg-mark{fill:var(--accent,#b0582d)}
.dg-packet{fill:var(--accent,#b0582d)}
.dg-arm{stroke:var(--ink,#1b2127);stroke-width:2.5;stroke-linecap:round}
.dg-rotor{fill:color-mix(in srgb,var(--steel,#2f5f8a) 25%,transparent);stroke:var(--steel,#2f5f8a);stroke-width:1}
.dg-ghost{fill:none;stroke:var(--steel,#2f5f8a);stroke-width:1.2;stroke-dasharray:3 2}
.dg-body{fill:var(--accent,#b0582d)}
.dg-cam{fill:var(--ink,#1b2127)}
.dg-cone{stroke:var(--accent,#b0582d);stroke-width:.8;stroke-opacity:.4}</style>
