<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="With a delay below the designed margin the agents agree; above it they drift apart">
<style>.dg-plane{fill:color-mix(in srgb,var(--steel,#2f5f8a) 10%,transparent);stroke:var(--steel,#2f5f8a);stroke-width:1;stroke-opacity:.5}
.dg-grid{stroke:var(--line,#d2d7dd);stroke-width:1}
.dg-axis{fill:none;stroke:var(--muted,#56606b);stroke-width:1.3}
.dg-label{fill:var(--muted,#56606b);font:700 11px 'Atkinson Hyperlegible',system-ui,sans-serif;letter-spacing:.02em}
